name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build (darwin/arm64)
        run: |
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o d-awg-router-web-darwin-arm64 ./cmd/d-awg-router-web/
          echo "SHA256: $(shasum -a 256 d-awg-router-web-darwin-arm64)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: d-awg-router-web-darwin-arm64
          path: d-awg-router-web-darwin-arm64

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: d-awg-router-web-darwin-arm64
          generate_release_notes: true
