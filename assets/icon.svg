<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2332"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#1f6feb"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#30363d;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:0.9"/>
    </linearGradient>
  </defs>

  <!-- Round background -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- Shield outline -->
  <path d="M256 60 L400 130 L400 280 Q400 400 256 460 Q112 400 112 280 L112 130 Z"
        fill="url(#shield)" stroke="#58a6ff" stroke-width="4" stroke-opacity="0.5"/>

  <!-- Lynx head -->
  <!-- Ears -->
  <path d="M202 165 L195 110 L220 155Z" fill="url(#accent)" opacity="0.8"/>
  <path d="M310 165 L317 110 L292 155Z" fill="url(#accent)" opacity="0.8"/>
  <!-- Ear tufts -->
  <path d="M195 110 L190 95 L200 108Z" fill="#58a6ff" opacity="0.9"/>
  <path d="M317 110 L322 95 L312 108Z" fill="#58a6ff" opacity="0.9"/>

  <!-- Face -->
  <ellipse cx="256" cy="240" rx="60" ry="50" fill="#c9d1d9" opacity="0.15"/>
  <ellipse cx="256" cy="240" rx="55" ry="45" fill="none" stroke="#58a6ff" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Eyes -->
  <ellipse cx="238" cy="230" rx="10" ry="12" fill="#0d1117"/>
  <ellipse cx="274" cy="230" rx="10" ry="12" fill="#0d1117"/>
  <ellipse cx="238" cy="230" rx="5" ry="6" fill="#58a6ff"/>
  <ellipse cx="274" cy="230" rx="5" ry="6" fill="#58a6ff"/>
  <ellipse cx="240" cy="228" rx="2" ry="2" fill="#fff" opacity="0.7"/>
  <ellipse cx="276" cy="228" rx="2" ry="2" fill="#fff" opacity="0.7"/>

  <!-- Nose -->
  <path d="M250 248 L256 254 L262 248 Z" fill="#8b949e"/>

  <!-- Mouth -->
  <path d="M256 254 Q248 262 240 256" fill="none" stroke="#8b949e" stroke-width="1.5" opacity="0.6"/>
  <path d="M256 254 Q264 262 272 256" fill="none" stroke="#8b949e" stroke-width="1.5" opacity="0.6"/>

  <!-- Whiskers -->
  <line x1="195" y1="245" x2="225" y2="248" stroke="#8b949e" stroke-width="1" opacity="0.4"/>
  <line x1="195" y1="250" x2="225" y2="250" stroke="#8b949e" stroke-width="1" opacity="0.4"/>
  <line x1="287" y1="248" x2="317" y2="245" stroke="#8b949e" stroke-width="1" opacity="0.4"/>
  <line x1="287" y1="250" x2="317" y2="250" stroke="#8b949e" stroke-width="1" opacity="0.4"/>

  <!-- Connection lines (network nodes) -->
  <circle cx="130" cy="200" r="4" fill="#58a6ff" opacity="0.6"/>
  <circle cx="382" cy="200" r="4" fill="#58a6ff" opacity="0.6"/>
  <circle cx="150" cy="320" r="3" fill="#58a6ff" opacity="0.4"/>
  <circle cx="362" cy="320" r="3" fill="#58a6ff" opacity="0.4"/>
  <circle cx="256" cy="130" r="3" fill="#58a6ff" opacity="0.5"/>
  <circle cx="256" cy="360" r="3" fill="#58a6ff" opacity="0.5"/>

  <!-- Connection lines to/from shield -->
  <line x1="134" y1="200" x2="195" y2="200" stroke="#58a6ff" stroke-width="1.5" opacity="0.3"/>
  <line x1="317" y1="200" x2="378" y2="200" stroke="#58a6ff" stroke-width="1.5" opacity="0.3"/>
  <line x1="153" y1="320" x2="210" y2="280" stroke="#58a6ff" stroke-width="1" opacity="0.2"/>
  <line x1="359" y1="320" x2="302" y2="280" stroke="#58a6ff" stroke-width="1" opacity="0.2"/>

  <!-- WG/AWG indicator dots -->
  <circle cx="210" cy="380" r="5" fill="#238636" opacity="0.7"/>
  <circle cx="256" cy="380" r="5" fill="#58a6ff" opacity="0.5"/>
  <circle cx="302" cy="380" r="5" fill="#238636" opacity="0.7"/>

  <!-- Small data flow dots -->
  <circle cx="134" cy="200" r="2" fill="#3fb950" opacity="0.8"/>
  <circle cx="378" cy="200" r="2" fill="#3fb950" opacity="0.8"/>

  <!-- Version/tooltip bar at bottom -->
  <rect x="180" y="420" width="152" height="24" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1" opacity="0.7"/>
  <text x="256" y="436" font-family="monospace" font-size="11" fill="#8b949e" text-anchor="middle" opacity="0.8">d-awg-router v2</text>
</svg>
